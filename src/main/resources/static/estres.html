<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Estrés</title>
    <link rel="stylesheet" href="paciente.css">
</head>
<body>

<header class="header">
    <h2>Registro de Estrés</h2>
    <div class="nav">
        <a href="dashboard-paciente.html">Panel</a>
        <a href="index.html">Inicio</a>
    </div>
</header>

<div class="contenedor">
    <div class="card">
        <h1 class="titulo">Nivel de Estrés</h1>

        <form class="formulario" onsubmit="registrarEstres(event)">
            <label>Nivel de estrés 1 - 10</label>
            <input type="number" id="nivel" min="1" max="10" required>

            <label>Causa principal</label>
            <select id="causa">
                <option value="Estudios">Estudios</option>
                <option value="Trabajo">Trabajo</option>
                <option value="Familia">Familia</option>
                <option value="Salud">Salud</option>
                <option value="Otro">Otro</option>
            </select>

            <label>Síntomas</label>
            <textarea id="sintomas" placeholder="Ejemplo: cansancio, dolor de cabeza, ansiedad"></textarea>

            <button type="submit">Guardar Registro</button>
        </form>
    </div>
</div>

<script src="paciente.js"></script>
</body>
</html>
